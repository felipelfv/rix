# Builds, tests and publishes the images in this folder to the GitHub
# Container Registry of the org this repository lives in.
#
# NOTE: this file is intentionally NOT under .github/workflows in the {rix}
# repository. It is meant to be moved there once these Dockerfiles live in
# their own repository under the rstats-on-nix organisation. See
# docker/README.md.
#
# Images are built natively on amd64 and arm64 runners rather than under QEMU:
# emulated Nix builds are slow, and anything missing from the binary cache
# would be compiled from source.

name: Publish images

on:
  push:
    branches: [main]
    paths:
      - "ubuntu/**"
      - "alpine/**"
      - "test/**"
      - ".github/workflows/publish-images.yml"
  schedule:
    # Rebuild monthly so that base images and the binary cache stay fresh
    - cron: "0 4 1 * *"
  workflow_dispatch:

# A scheduled run and a push should not race each other for the `latest` tag
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Resolve `main` of ropensci/rix to a commit once, so that all four `rix`
  # images bootstrap from the same, pinned `inst/extdata/default.nix`.
  pin:
    runs-on: ubuntu-latest
    outputs:
      rix_ref: ${{ steps.ref.outputs.sha }}
    steps:
      - id: ref
        run: |
          sha="$(git ls-remote https://github.com/ropensci/rix refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.runner }}
    needs: pin
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base: [ubuntu, alpine]
        target: [nix, rix]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.target }}-${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4

      # The `rix` images are ~5.5 GB; the default runner has ~14 GB free
      - name: Free disk space
        if: matrix.target == 'rix'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set image name
        id: image
        run: echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer caching in the GitHub Actions cache is capped at 10 GB per
      # repository, so only the small `nix` stage is cached; the `rix` layers
      # would just evict each other.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.base }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: RIX_REF=${{ needs.pin.outputs.rix_ref }}
          labels: org.opencontainers.image.revision.rix=${{ needs.pin.outputs.rix_ref }}
          load: true
          tags: ${{ steps.image.outputs.name }}:test
          cache-from: type=gha,scope=${{ matrix.base }}-nix-${{ matrix.arch }}
          cache-to: ${{ matrix.target == 'nix' && format('type=gha,mode=max,scope={0}-nix-{1}', matrix.base, matrix.arch) || '' }}

      - name: Smoke test (nix)
        if: matrix.target == 'nix'
        run: docker run --rm "${{ steps.image.outputs.name }}:test" nix --version

      - name: Smoke test (rix)
        if: matrix.target == 'rix'
        run: |
          docker run --rm -v "$PWD/test:/test:ro" "${{ steps.image.outputs.name }}:test" \
            rix-shell --run "Rscript /test/smoke.R && nix-build /tmp/smoke"

      # Same inputs as above, so this is served from the local build cache
      - name: Push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.base }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: RIX_REF=${{ needs.pin.outputs.rix_ref }}
          labels: org.opencontainers.image.revision.rix=${{ needs.pin.outputs.rix_ref }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.base }}-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base: [ubuntu, alpine]
        target: [nix, rix]
    env:
      IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.target }}-${{ matrix.base }}
    steps:
      - name: Set image name
        id: image
        run: echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.base }}-${{ matrix.target }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the *build* date plus `latest`. Note this is not the
      # rstats-on-nix snapshot date pinned inside the image.
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          date_tag="$(date -u +%Y-%m-%d)"
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.name }}:latest" \
            -t "${{ steps.image.outputs.name }}:${date_tag}" \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:latest"
